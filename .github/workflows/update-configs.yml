
name: Run Config-Updater

on:
  schedule:
    - cron: '30 20 * * *' # 00:00 Tehran
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-proxy-configs
  cancel-in-progress: false

jobs:
  update-configs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Ensure workflow runs on main
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "This workflow must run on the main branch; got: $GITHUB_REF" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y jq unzip

      - name: Install Xray with retry
        shell: bash
        run: |
          set -Eeuo pipefail
          MAX_RETRIES=3
          FALLBACK_VERSION="v26.3.27"

          install_xray() {
            local url
            url="$(curl --fail --silent --show-error --location --retry 3 \
              https://api.github.com/repos/XTLS/Xray-core/releases/latest |
              jq -er '[.assets[]? | select(.name == "Xray-linux-64.zip")][0].browser_download_url')" || url=""

            local candidates=()
            [[ -n "$url" ]] && candidates+=("$url")
            candidates+=("https://github.com/XTLS/Xray-core/releases/download/${FALLBACK_VERSION}/Xray-linux-64.zip")

            local candidate
            for candidate in "${candidates[@]}"; do
              rm -f xray.zip xray geoip.dat geosite.dat
              if ! curl --fail --silent --show-error --location --retry 3 --max-time 90 -o xray.zip "$candidate"; then
                echo "Xray download failed; trying next candidate if available." >&2
                continue
              fi
              if ! unzip -o xray.zip xray geoip.dat geosite.dat; then
                echo "Xray archive extraction failed." >&2
                continue
              fi
              sudo install -m 0755 xray /usr/local/bin/xray
              if xray version; then
                rm -f xray.zip xray geoip.dat geosite.dat LICENSE
                return 0
              fi
            done
            return 1
          }

          attempt=1
          until install_xray; do
            if (( attempt >= MAX_RETRIES )); then
              echo "Unable to install and verify Xray after ${MAX_RETRIES} attempts." >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 15
          done

      - name: Install sing-box with retry
        shell: bash
        run: |
          set -Eeuo pipefail
          MAX_RETRIES=3
          FALLBACK_VERSION="1.14.0"

          install_singbox() {
            local url
            url="$(curl --fail --silent --show-error --location --retry 3 \
              https://api.github.com/repos/SagerNet/sing-box/releases/latest |
              jq -er '[.assets[]? | select(.name | endswith("_linux_amd64.deb"))][0].browser_download_url')" || url=""

            local candidates=()
            [[ -n "$url" ]] && candidates+=("$url")
            candidates+=("https://github.com/SagerNet/sing-box/releases/download/v${FALLBACK_VERSION}/sing-box_${FALLBACK_VERSION}_linux_amd64.deb")

            local candidate
            for candidate in "${candidates[@]}"; do
              rm -f sing-box.deb
              if ! curl --fail --silent --show-error --location --retry 3 --max-time 90 -o sing-box.deb "$candidate"; then
                echo "sing-box download failed; trying next candidate if available." >&2
                continue
              fi
              if sudo apt-get install -y ./sing-box.deb && sing-box version; then
                rm -f sing-box.deb
                return 0
              fi
            done
            return 1
          }

          attempt=1
          until install_singbox; do
            if (( attempt >= MAX_RETRIES )); then
              echo "Unable to install and verify sing-box after ${MAX_RETRIES} attempts." >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 15
          done

      - name: Prepare isolated pipeline workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f src/fetch_configs.py
          test -f settings/user_settings.py
          PIPELINE_DIR="$RUNNER_TEMP/sub-independent-pipeline"
          echo "PIPELINE_DIR=$PIPELINE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$PIPELINE_DIR"
          tar --exclude='./.git' -cf - . | tar -xf - -C "$PIPELINE_DIR"

          cd "$PIPELINE_DIR"
          mkdir -p assets configs

          # Remove generated files from the isolated copy only. The checked-out
          # published files remain untouched until every required output passes.
          rm -f \
            configs/proxy_configs.txt \
            configs/proxy_configs_tested.txt \
            configs/singbox_configs_all.json \
            configs/singbox_configs_tested.json \
            configs/singbox_configs_secure.json \
            configs/clash_configs_all.yaml \
            configs/clash_configs_tested.yaml \
            configs/clash_configs_secure.yaml \
            configs/xray_loadbalanced_config.json \
            configs/xray_fragment_loadbalanced_config.json \
            configs/xray_secure_loadbalanced_config.json \
            configs/channel_stats.json \
            configs/location_cache.json
          rm -rf configs/location
          rm -f assets/channel_stats_chart.svg assets/performance_report.html

      - name: Run pipeline and validate fresh outputs
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PIPELINE_DIR"

          python src/fetch_configs.py
          test -s configs/proxy_configs.txt || {
            echo "Fetch stage produced no fresh proxy_configs.txt; refusing to publish." >&2
            exit 1
          }
          python - <<'PY'
          from pathlib import Path
          p = Path('configs/proxy_configs.txt')
          entries = [line.strip() for line in p.read_text(encoding='utf-8').splitlines()
                     if line.strip() and not line.lstrip().startswith('//') and not line.lstrip().startswith('#')]
          if not entries:
              raise SystemExit('Fetcher produced a header-only file; refusing to publish.')
          print(f'Fetcher produced {len(entries)} candidate lines.')
          PY
          test -s configs/channel_stats.json || {
            echo "Fetch stage did not produce fresh channel statistics." >&2
            exit 1
          }
          python -m json.tool configs/channel_stats.json > /dev/null

          python src/enrich_configs.py configs/proxy_configs.txt configs/location_cache.json
          python src/rename_configs.py configs/location_cache.json configs/proxy_configs.txt configs/proxy_configs.txt
          test -s configs/proxy_configs.txt || {
            echo "Enrichment/rename stage produced an empty input." >&2
            exit 1
          }

          python src/xray_config_tester.py configs/proxy_configs.txt configs/proxy_configs_tested.txt 2>&1 | tee xray-test.log
          if grep -Fq "No working configs found" xray-test.log; then
            echo "Xray tester found no working configs; refusing to publish fallback input." >&2
            exit 1
          fi
          test -s configs/proxy_configs_tested.txt || {
            echo "Xray test stage produced no tested configs." >&2
            exit 1
          }
          cp configs/proxy_configs_tested.txt configs/proxy_configs.txt

          python src/country_splitter.py configs/proxy_configs_tested.txt configs/location_cache.json configs/location

          python src/config_to_singbox.py
          test -s configs/singbox_configs_all.json
          python -m json.tool configs/singbox_configs_all.json > /dev/null

          python src/config_tester.py configs/singbox_configs_all.json configs/singbox_configs_tested.json 2>&1 | tee singbox-test.log
          if grep -Fq "No working configs found" singbox-test.log; then
            echo "sing-box tester found no working configs; refusing to publish fallback input." >&2
            exit 1
          fi
          test -s configs/singbox_configs_tested.json || {
            echo "sing-box test stage produced no tested configs." >&2
            exit 1
          }
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('configs/singbox_configs_tested.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          outbounds = data.get('outbounds') if isinstance(data, dict) else None
          if not isinstance(outbounds, list):
              raise SystemExit('sing-box tested output has no outbounds list')
          excluded = {'selector', 'urltest', 'direct', 'block', 'dns'}
          proxies = [item for item in outbounds if isinstance(item, dict) and item.get('type') not in excluded]
          if not proxies:
              raise SystemExit('sing-box tested output contains no proxy outbounds')
          print(f'Validated {len(proxies)} tested sing-box proxy outbounds.')
          PY
          cp configs/singbox_configs_tested.json configs/singbox_configs_all.json

          python src/security_filter.py
          python src/singbox_to_clash.py
          python src/xray_balancer.py
          python src/xray_fragment_balancer.py

          # Required generated outputs must be fresh and structurally valid.
          required_files=(
            configs/proxy_configs.txt
            configs/proxy_configs_tested.txt
            configs/location_cache.json
            configs/singbox_configs_all.json
            configs/singbox_configs_tested.json
            configs/singbox_configs_secure.json
            configs/clash_configs_all.yaml
            configs/clash_configs_tested.yaml
            configs/clash_configs_secure.yaml
            configs/xray_loadbalanced_config.json
            configs/xray_fragment_loadbalanced_config.json
            configs/xray_secure_loadbalanced_config.json
            configs/channel_stats.json
          )
          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Required output is missing or empty: $file" >&2
              exit 1
            fi
          done

          for file in \
            configs/location_cache.json \
            configs/singbox_configs_all.json \
            configs/singbox_configs_tested.json \
            configs/singbox_configs_secure.json \
            configs/xray_loadbalanced_config.json \
            configs/xray_fragment_loadbalanced_config.json \
            configs/xray_secure_loadbalanced_config.json \
            configs/channel_stats.json; do
            python -m json.tool "$file" > /dev/null
          done

          python src/generate_charts.py
          test -s assets/channel_stats_chart.svg
          test -s assets/performance_report.html

      - name: Publish validated outputs to repository workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PIPELINE_DIR"

          # Copy only known generated files; never stage the entire workspace.
          files=(
            configs/proxy_configs.txt
            configs/proxy_configs_tested.txt
            configs/location_cache.json
            configs/singbox_configs_all.json
            configs/singbox_configs_tested.json
            configs/singbox_configs_secure.json
            configs/clash_configs_all.yaml
            configs/clash_configs_tested.yaml
            configs/clash_configs_secure.yaml
            configs/xray_loadbalanced_config.json
            configs/xray_fragment_loadbalanced_config.json
            configs/xray_secure_loadbalanced_config.json
            configs/channel_stats.json
            assets/channel_stats_chart.svg
            assets/performance_report.html
          )
          for file in "${files[@]}"; do
            install -D "$file" "$GITHUB_WORKSPACE/$file"
          done

          # Country outputs are a generated set; replace the set only after validation.
          if [[ -d configs/location ]]; then
            find configs/location -type f -print -quit | grep -q . || {
              echo "Country split produced no files; refusing to replace published country outputs." >&2
              exit 1
            }
            rm -rf "$GITHUB_WORKSPACE/configs/location"
            mkdir -p "$GITHUB_WORKSPACE/configs/location"
            cp -a configs/location/. "$GITHUB_WORKSPACE/configs/location/"
          else
            echo "Country split output directory is missing." >&2
            exit 1
          fi
          
      - name: Update subscription configuration counts
        shell: bash
        run: |
          set -Eeuo pipefail
          python .github/scripts/update_subscription_counts.py
          
      - name: Update README cache-busting timestamps
        shell: bash
        run: |
          set -Eeuo pipefail
          timestamp="$(date +%s)"
          sed -i "s/channel_stats_chart\.svg?v=[0-9]*/channel_stats_chart.svg?v=$timestamp/" README.md
          sed -i "s/performance_report\.html?v=[0-9]*/performance_report.html?v=$timestamp/" README.md

      - name: Commit and push validated outputs
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add -- \
            configs/proxy_configs.txt \
            configs/proxy_configs_tested.txt \
            configs/location_cache.json \
            configs/singbox_configs_all.json \
            configs/singbox_configs_tested.json \
            configs/singbox_configs_secure.json \
            configs/clash_configs_all.yaml \
            configs/clash_configs_tested.yaml \
            configs/clash_configs_secure.yaml \
            configs/xray_loadbalanced_config.json \
            configs/xray_fragment_loadbalanced_config.json \
            configs/xray_secure_loadbalanced_config.json \
            configs/channel_stats.json \
            configs/location/ \
            assets/channel_stats_chart.svg \
            assets/performance_report.html \
            README.md

          if git diff --cached --quiet; then
            echo "No validated output changes to commit."
            exit 0
          fi

          echo "Files staged for publication:"
          git diff --cached --name-only
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Update proxy configs, stats and reports"

          # Retry only after a clean rebase onto the latest main. A conflict is fatal.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Successfully pushed validated outputs to main."
              exit 0
            fi
            if (( attempt == 3 )); then
              echo "Push failed after ${attempt} attempts." >&2
              exit 1
            fi
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict; stopping rather than publishing an uncertain state." >&2
              exit 1
            fi
            sleep 10
          done
